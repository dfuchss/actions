name: Build and/or Deploy Maven Projects

on:
  workflow_call:
    inputs:
        with-submodules:
          description: "Clone repository with its submodules"
          type: boolean
          required: false
          default: false
        deploy:
          description: "Switch to enable or disable the deployment process"
          type: boolean
          required: true
        runs-on:
          description: "Tag for the runner to use in the main job."
          type: string
          required: false
          default: "ubuntu-latest"

    secrets:
      CENTRAL_USER:
        required: true
      CENTRAL_TOKEN:
        required: true
      GPG_KEY:
        required: true
          
jobs:     
  build:
    name: "Build and/or Deploy"
    runs-on: ${{ inputs.runs-on }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: ${{ inputs.with-submodules }}
        fetch-depth: 0

    - name: Determine Java version
      id: jve
      shell: bash
      run: |
        for expr in maven.compiler.target maven.compiler.release java.version; do
          v=$(mvn -B -q -N help:evaluate -DforceStdout -Dexpression="$expr" 2>/dev/null || true)
          v=${v#1.}
          if [[ "$v" =~ ^[0-9]+ ]]; then
            echo "java_major_version=${BASH_REMATCH[0]}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done
        echo "::error::Could not determine the Java version from the POM"
        exit 1

    - name: Java with Cache
      uses: actions/setup-java@v6
      if: ${{ !inputs.deploy }}
      with:
        java-version: ${{ steps.jve.outputs.java_major_version }}
        distribution: 'temurin'
        cache: 'maven'


    - name: Java without Cache
      uses: actions/setup-java@v6
      if: ${{ inputs.deploy }}
      with:
        java-version: ${{ steps.jve.outputs.java_major_version }}
        distribution: 'temurin'

    - name: Maven Verify
      shell: bash
      run: mvn -U -B verify

    - name: Set maven settings.xml
      uses: whelk-io/maven-settings-xml-action@v22
      if: ${{ inputs.deploy }}
      with:
        servers: '[{ "id": "central", "username": "${{ secrets.CENTRAL_USER }}", "password": "${{ secrets.CENTRAL_TOKEN }}" }]'

    - name: Import GPG key
      uses: crazy-max/ghaction-import-gpg@v7
      if: ${{ inputs.deploy }}
      with:
        gpg_private_key: ${{ secrets.GPG_KEY }}

    - name: Publish Package
      if: ${{ inputs.deploy }}
      shell: bash
      run: mvn -DskipTests -P deployment -U -B deploy
